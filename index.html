<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambio Lite</title>
  <!-- PWA: app name, icons and how it opens when installed -->
  <link rel="manifest" href="manifest.json">
  <!-- colour of the phone's status bar; app.js updates it to match the background -->
  <meta name="theme-color" content="#1e2028">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- defer = run app.js after the HTML below has been parsed -->
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Ambio Lite</h1>

    <section class="timer">
      <div id="time" class="time">25:00</div>
      <div class="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="resetBtn" type="button" class="secondary">Reset</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <!-- Sound cards are generated by app.js from the SOUNDS list -->
    <section id="sounds" class="sounds" aria-label="Sounds"></section>
  </main>
</body>
</html>
